name: API check

# Diffs the component API (props, events, slots, contexts) against the base
# branch with `sveld --check`, which classifies each change as a semver bump.
# A breaking change fails the check unless the PR has the "breaking changes"
# label, which pr-labels.yml adds for a `!` title or a `BREAKING CHANGE:` body,
# or a maintainer adds by hand. `labeled`/`unlabeled` re-run the check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "scripts/build-docs.ts"
      - ".github/workflows/api-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  IBM_TELEMETRY_DISABLED: true

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      # The PR's merge commit, so changes that landed on the base branch since
      # the PR branched don't read as removals. Its first parent is the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Each side installs its own sveld, so a sveld bump reports what the new
      # version changes in the generated API.
      - name: Build the base branch's API
        run: |
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          cd "$RUNNER_TEMP/base"
          bun ci --ignore-scripts
          bun run build:docs --no-strict
          cp docs/src/COMPONENT_API.json "$RUNNER_TEMP/base-api.json"

      - run: bun ci --ignore-scripts

      - name: Diff the API against the base branch
        id: check
        run: |
          set +e
          bunx sveld --glob --types=false --check="$RUNNER_TEMP/base-api.json" > "$RUNNER_TEMP/report.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/report.txt"
          {
            echo "## API check"
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"

      - name: Fail on an unmarked breaking change
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.check.outputs.exit-code }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EXIT_CODE" = 0 ]; then exit 0; fi
          # A sveld bump that changes COMPONENT_API.json's schemaVersion
          # can't be diffed against the base; skip rather than block it.
          if [ "$EXIT_CODE" = 1 ] && grep -q "schemaVersion" "$RUNNER_TEMP/report.txt"; then
            echo "::notice::The base branch's API has a different schemaVersion, so it wasn't diffed."
            exit 0
          fi
          if [ "$EXIT_CODE" != 3 ]; then
            echo "::error::sveld --check exited $EXIT_CODE; see the log above."
            exit 1
          fi
          # Read the labels now, not from the event: pr-labels.yml may have
          # added "breaking changes" while this job ran.
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx "breaking changes"; then
            echo "::notice::Breaking API change, marked with the \"breaking changes\" label."
            exit 0
          fi
          echo "::error::Breaking API change. If it's intended, add \`!\` to the PR title (for example \`feat(button)!: ...\`) or the \"breaking changes\" label."
          exit 1
