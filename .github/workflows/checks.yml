on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IBM_TELEMETRY_DISABLED: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci
      - run: bunx biome ci --error-on-warnings

      - name: Build docs
        run: bun run build:docs

      - run: bun run test:src-types

      - run: bun run test:src-svelte

      - run: bun run test:package-exports

  changes:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.filter.outputs.unit }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs-deploy: ${{ steps.filter.outputs.docs-deploy }}
      css: ${{ steps.filter.outputs.css }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            unit:
              - 'src/**'
              - 'css/**'
              - 'tests/**'
              - 'tests-svelte3/**'
              - 'tests-svelte4/**'
              - 'scripts/**'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/**'
            e2e:
              - 'src/**'
              - 'css/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'playwright.config.ts'
              - 'tsconfig*.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/**'
            css:
              - 'css/**'
              - 'scripts/check-css-cascade.ts'
              - 'scripts/lib/css-*.ts'
            docs-deploy:
              - 'src/**'
              - 'css/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/**'

  # Informational: prints the compiled-rule delta, specificity histogram and
  # size movement against the base branch in the job summary. The script exits
  # non-zero on a cascade flip candidate, which over-reports by design, so the
  # job never blocks a merge.
  css-cascade:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.css == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci
      - name: Cascade diff against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          status=0
          bun run check:css --base "origin/$BASE_REF" > cascade.txt 2>&1 || status=$?
          {
            echo '```'
            head -c 60000 cascade.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  test:
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci

      - name: Generate types
        run: bun run build:docs

      - name: Test types (Svelte 5)
        run: bun run test:types

      - name: Test (Svelte 5)
        run: bun run test

  test-e2e:
    needs: [static-checks, changes, test]
    if: |
      always() &&
      !cancelled() &&
      needs.static-checks.result == 'success' &&
      needs.changes.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    # Official image includes Chromium/Firefox/WebKit + system deps
    # Bump tag with @playwright/test in bun.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host --init
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Playwright image is minimal; setup-bun extracts a zip and needs unzip.
      # Try installing first (fast path) and only refresh apt lists if needed.
      - run: DEBIAN_FRONTEND=noninteractive apt-get install -y unzip || { apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y unzip; }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # --ignore-scripts skips the ibmtelemetry postinstall (already disabled
      # via IBM_TELEMETRY_DISABLED) and Playwright's browser download (browsers
      # are baked into the image at PLAYWRIGHT_BROWSERS_PATH).
      - run: bun ci --ignore-scripts

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: css
        with:
          path: css/*.css
          key: css-${{ runner.os }}-${{ hashFiles('css/**/*.scss', 'scripts/build-css.ts', 'package.json', 'bun.lock') }}

      - name: Build CSS
        if: steps.css.outputs.cache-hit != 'true'
        run: bun run build:css

      - name: E2E tests
        run: bunx playwright test --project=chromium

  test-svelte-compat:
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: tests-svelte3
            label: Svelte 3
          - dir: tests-svelte4
            label: Svelte 4 compat
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci

      - name: Setup ${{ matrix.label }}
        run: |
          cd ${{ matrix.dir }}
          bun ci

      - name: Generate types
        run: bun run build:docs

      - name: Test types (${{ matrix.label }})
        run: |
          cd ${{ matrix.dir }}
          bun run test:types

      - name: Test (${{ matrix.label }})
        run: |
          cd ${{ matrix.dir }}
          bun run test

  deploy-docs:
    needs: [static-checks, changes, test]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs-deploy == 'true') &&
      !failure() && !cancelled()
    uses: ./.github/workflows/deploy-docs.yml
    secrets: inherit
