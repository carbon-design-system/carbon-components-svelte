# `paths`, not `paths-ignore`, so the docs files a test imports can opt back
# in. Keep them in step with the `unit` and `e2e` filters below.
on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!examples/**"
      - "docs/src/token-reference.ts"
      - "docs/src/pages/framed/DatePicker/**"
  push:
    branches: [master]
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!examples/**"
      - "docs/src/token-reference.ts"
      - "docs/src/pages/framed/DatePicker/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IBM_TELEMETRY_DISABLED: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci
      - run: bunx biome ci --error-on-warnings

      - name: Build docs
        run: bun run build:docs

      - run: bun run test:src-types

      - run: bun run test:src-js

      - run: bun run test:src-svelte

      - run: bun run test:package-exports

      - run: bun run check:package

      - run: bun run thumbnails catalog

  changes:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.filter.outputs.unit }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs-deploy: ${{ steps.filter.outputs.docs-deploy }}
      css: ${{ steps.filter.outputs.css }}
      css-size: ${{ steps.filter.outputs.css-size }}
      # `all`, `none`, or space-separated test files; empty (= all) off PRs.
      unit-tests: ${{ steps.select.outputs.unit-tests }}
      e2e-tests: ${{ steps.select.outputs.e2e-tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            unit:
              - 'src/**'
              - 'css/**'
              - 'tests/**'
              - 'tests-svelte3/**'
              - 'tests-svelte4/**'
              - 'scripts/**'
              - 'e2e/**'
              - 'crassus.config.ts'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/**'
              - 'docs/src/token-reference.ts'
            e2e:
              - 'src/**'
              - 'css/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'playwright.config.ts'
              - 'tsconfig*.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/**'
              - 'docs/src/pages/framed/DatePicker/**'
            css:
              - 'css/**'
              - 'crassus.config.ts'
            css-size:
              - 'css/**'
              - 'crassus.config.ts'
              - 'scripts/check-css-size.ts'
              - 'scripts/lib/css-size.ts'
              - 'scripts/lib/css-targets.ts'
              - 'package.json'
              - 'bun.lock'
            docs-deploy:
              - 'src/**'
              - 'css/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/**'

      # PRs run only the unit and e2e tests the diff can reach in the static
      # dependency graph (scripts/lib/test-graph.ts). Zero-dependency, so no
      # install, except to compile and diff the CSS for a css/ change, which
      # narrows the e2e tests to the pages that render a changed class
      # (scripts/lib/css-delta.ts). Pushes to master run everything, which
      # catches any miss.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'pull_request'
      - run: bun ci --ignore-scripts
        if: github.event_name == 'pull_request' && steps.filter.outputs.css == 'true'
      # Compiled CSS by css/ tree hash, so a rerun or a later push that
      # leaves css/ alone skips both compiles.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request' && steps.filter.outputs.css == 'true'
        with:
          path: node_modules/.cache/test-changed-css
          key: test-changed-css-${{ hashFiles('css/**', 'crassus.config.ts', 'bun.lock') }}
          restore-keys: test-changed-css-
      - name: Select affected tests
        id: select
        if: github.event_name == 'pull_request'
        run: bun scripts/test-changed.ts "origin/${{ github.base_ref }}" --github-output

  # Informational: prints the compiled-rule delta, specificity histogram and
  # size movement against the base branch in the job summary, and annotates
  # each cascade flip at its .scss line. crassus exits non-zero on a cascade
  # flip candidate, which over-reports by design, so the job never blocks a
  # merge.
  css-cascade:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.css == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci
      - name: Cascade diff against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        # One run: annotations on stdout, the human report (fenced, cut to
        # fit the 1 MiB summary limit) appended to the job summary.
        run: bun run check:css --base "origin/$BASE_REF" --format github --summary "$GITHUB_STEP_SUMMARY"

  # Fails when the PR grows all.css or white.css by more than the per-PR
  # limit (scripts/lib/css-size.ts) against the base branch. A PR that
  # needs more names the amount and the reason in a CSS-Size-Growth commit
  # trailer; see CONTRIBUTING, Guards.
  css-size:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.css-size == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci --ignore-scripts
      - name: Size growth against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun run check:css:size --base "origin/$BASE_REF" --format github --summary "$GITHUB_STEP_SUMMARY"

  test:
    name: test (${{ matrix.shard }}/2)
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci

      - name: Generate types
        run: bun run build:docs

      - name: Test types (Svelte 5)
        if: matrix.shard == 1
        run: bun run test:types

      # Each shard runs half of the selected files, so an empty half passes.
      - name: Test (Svelte 5)
        env:
          TESTS: ${{ needs.changes.outputs.unit-tests }}
          SHARD: ${{ matrix.shard }}/2
        run: |
          case "$TESTS" in
            "" | all) bunx vitest run --shard="$SHARD" --passWithNoTests ;;
            none) echo "No unit tests affected." ;;
            *) read -ra files <<< "$TESTS" && bunx vitest run --shard="$SHARD" --passWithNoTests "${files[@]}" ;;
          esac

      # The DatePicker calendar does its own date math. Run its tests where a
      # daylight-saving switch skips midnight, and where a whole day was
      # skipped (Pacific/Apia, December 2011).
      - name: Test calendar date math across time zones
        if: matrix.shard == 2
        env:
          TESTS: ${{ needs.changes.outputs.unit-tests }}
        run: |
          case "$TESTS" in
            none) exit 0 ;;
            "" | all) ;;
            *) [[ " $TESTS " == *" tests/DatePicker/calendar"* ]] || exit 0 ;;
          esac
          for zone in America/Santiago America/Havana Asia/Tehran Pacific/Apia; do
            echo "TZ=$zone"
            TZ="$zone" bunx vitest run tests/DatePicker/calendar
          done

  # Starts as soon as the test selection is known, alongside the unit tests,
  # rather than after them: waiting put both suites on the critical path.
  test-e2e:
    name: test-e2e (${{ matrix.shard }}/2)
    needs: [changes]
    if: |
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true') &&
      needs.changes.outputs.e2e-tests != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Official image includes Chromium/Firefox/WebKit + system deps
    # Bump tag with @playwright/test in bun.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host --init
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Playwright image is minimal; setup-bun extracts a zip and needs unzip.
      # Try installing first (fast path) and only refresh apt lists if needed.
      - run: DEBIAN_FRONTEND=noninteractive apt-get install -y unzip || { apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y unzip; }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # --ignore-scripts skips the ibmtelemetry postinstall (already disabled
      # via IBM_TELEMETRY_DISABLED) and Playwright's browser download (browsers
      # are baked into the image at PLAYWRIGHT_BROWSERS_PATH).
      - run: bun ci --ignore-scripts

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: css
        with:
          path: css/*.css
          key: css-${{ runner.os }}-${{ hashFiles('css/**/*.scss', 'scripts/build-css.ts', 'package.json', 'bun.lock') }}

      - name: Build CSS
        if: steps.css.outputs.cache-hit != 'true'
        run: bun run build:css

      - name: E2E tests
        # The container's default shell is `sh`, which has no `read -a`/`<<<`.
        shell: bash
        env:
          TESTS: ${{ needs.changes.outputs.e2e-tests }}
          SHARD: ${{ matrix.shard }}/2
        run: |
          case "$TESTS" in
            "" | all) bunx playwright test --project=chromium --shard="$SHARD" --pass-with-no-tests ;;
            *) read -ra files <<< "$TESTS" && bunx playwright test --project=chromium --shard="$SHARD" --pass-with-no-tests "${files[@]}" ;;
          esac

  # Probe (do not merge): the full e2e suite on the bare runner with a
  # cached Chromium headless shell, to compare with the container shards.
  e2e-runner-probe:
    name: e2e-runner-probe (${{ matrix.shard }}/2)
    needs: [changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci --ignore-scripts
      - id: pw
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-shell
      - name: Install Chromium headless shell
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --only-shell chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: css
        with:
          path: css/*.css
          key: css-${{ runner.os }}-${{ hashFiles('css/**/*.scss', 'scripts/build-css.ts', 'package.json', 'bun.lock') }}
      - name: Build CSS
        if: steps.css.outputs.cache-hit != 'true'
        run: bun run build:css
      - name: E2E tests
        run: bunx playwright test --project=chromium --shard=${{ matrix.shard }}/2

  test-svelte-compat:
    name: test-svelte-compat (${{ matrix.label }}, ${{ matrix.shard }}/2)
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [tests-svelte3, tests-svelte4]
        shard: [1, 2]
        include:
          - dir: tests-svelte3
            label: Svelte 3
          - dir: tests-svelte4
            label: Svelte 4 compat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci

      - name: Setup ${{ matrix.label }}
        run: |
          cd ${{ matrix.dir }}
          bun ci

      - name: Generate types
        run: bun run build:docs

      - name: Test types (${{ matrix.label }})
        if: matrix.shard == 1
        run: |
          cd ${{ matrix.dir }}
          bun run test:types

      # Selected files outside this harness's `include` (Svelte 5-only
      # tests) are dropped, and a shard can get none, so an empty match passes.
      - name: Test (${{ matrix.label }})
        env:
          TESTS: ${{ needs.changes.outputs.unit-tests }}
          SHARD: ${{ matrix.shard }}/2
        run: |
          cd ${{ matrix.dir }}
          case "$TESTS" in
            "" | all) bunx vitest run --shard="$SHARD" --passWithNoTests ;;
            none) echo "No unit tests affected." ;;
            *) read -ra files <<< "$TESTS" && bunx vitest run --shard="$SHARD" --passWithNoTests "${files[@]/#/../}" ;;
          esac

  deploy-docs:
    needs: [static-checks, changes, test]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs-deploy == 'true') &&
      !failure() && !cancelled()
    uses: ./.github/workflows/deploy-docs.yml
    secrets: inherit
