# Production serves the latest release, so its docs match what npm
# installs. release.yml deploys it from the tag after it publishes.
# master deploys to the preview site, if one is set up.
on:
  workflow_call:
    inputs:
      # checks.yml sets this: it deploys once its tests pass.
      after-checks:
        type: boolean
        default: false
      target:
        type: string
        default: preview
  workflow_dispatch:
    inputs:
      # To redeploy production, run this from the latest release tag.
      target:
        type: choice
        options: [preview, production]
        default: preview
  # checks.yml skips a push that changes only docs/, and deploys only for
  # changes outside it, so a docs change deploys from here.
  push:
    branches: [master]
    paths:
      - "docs/**"

permissions: {}

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A push that also changes what checks.yml deploys for is its to
      # deploy, after the tests. Keep the patterns in step with its
      # docs-deploy filter. If the compare fails, deploy: a second deploy
      # costs a build, and a missed one leaves the site stale.
      - name: Leave the deploy to checks.yml
        id: guard
        if: github.event_name == 'push' && !inputs.after-checks && inputs.target != 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename') || exit 0
          while IFS= read -r file; do
            case "$file" in
              src/* | css/* | scripts/* | package.json | bun.lock | .github/*)
                echo "$file changed, so checks.yml deploys after its tests."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$files"

      # The hook deploys this commit, not the service branch's head.
      - name: Trigger deploy
        if: steps.guard.outputs.skip != 'true'
        env:
          TARGET: ${{ inputs.target || 'preview' }}
          production_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          preview_url: ${{ secrets.RENDER_PREVIEW_DEPLOY_HOOK_URL }}
        run: |
          if [ "$TARGET" = production ]; then
            deploy_url=$production_url
          else
            deploy_url=$preview_url
          fi
          if [ -z "$deploy_url" ]; then
            echo "No deploy hook for $TARGET, so nothing deploys."
            exit 0
          fi
          case "$deploy_url" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -fsS -o /dev/null "${deploy_url}${sep}ref=${GITHUB_SHA}"
          echo "Deployed $GITHUB_SHA to $TARGET."
