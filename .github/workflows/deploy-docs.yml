# The docs site serves the latest release, so its docs match what npm
# installs. release.yml deploys it from the tag after it publishes. To
# redeploy between releases, run this from the latest release tag: a run
# from master would publish docs for changes no release has yet.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The hook deploys this commit, not the service branch's head.
      - name: Trigger deploy
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          case "$deploy_url" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -fsS -o /dev/null "${deploy_url}${sep}ref=${GITHUB_SHA}"
          echo "Deployed $GITHUB_SHA."
