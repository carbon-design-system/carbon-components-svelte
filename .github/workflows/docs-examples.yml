name: Docs examples

# Type-checks and lints the docs site, type-checks its examples against the
# library's types, checks the docs markup against the CSS, and
# server-renders the framed examples.
# Runs only when the docs change; `checks.yml` ignores `docs/**`.
on:
  pull_request:
    paths:
      - "docs/**"

# Key on the PR number, not the branch name: two fork PRs can both come
# from a branch named `patch-1`.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IBM_TELEMETRY_DISABLED: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `bun lint`, which svelte-lint also runs, is only in canary builds.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      - run: bun ci --ignore-scripts
      - run: bun lint docs
      - run: bun run lint:svelte docs

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci --ignore-scripts
      - run: bun ci --ignore-scripts
        working-directory: docs

      # Scans `docs/src` for type helper classes the CSS no longer emits. It
      # compiles the Sass itself, so no build step is needed.
      - name: Check type helper classes
        run: bunx vitest run tests/css/v11-tokens.test.ts

      - name: Generate types
        run: bun run build:docs

      # Generates the search index the site imports before it checks.
      - name: Type-check the docs site
        run: bun run test:docs-types

      - name: Type-check examples
        run: bun run typecheck:examples
        working-directory: docs

      - name: Server-render framed examples
        run: bun run render:examples
        working-directory: docs

  # The built site's scroll behavior: lazily rendered examples, code views
  # and the API section must never move the page, in Chromium and in
  # WebKit, which has no scroll anchoring. See `docs/e2e/scroll.test.ts`.
  scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci --ignore-scripts
      - run: bun ci --ignore-scripts
        working-directory: docs

      - id: playwright
        run: echo "version=$(jq -r .version node_modules/playwright/package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      - name: Install Chromium and WebKit
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install chromium webkit
      # WebKit's system libraries aren't in the browser cache.
      - name: Install WebKit's dependencies
        run: bunx playwright install-deps webkit

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: css
        with:
          path: css/*.css
          key: css-${{ runner.os }}-${{ hashFiles('css/**/*.scss', 'scripts/build-css.ts', 'package.json', 'bun.lock') }}
      - name: Build CSS
        if: steps.css.outputs.cache-hit != 'true'
        run: bun run build:css

      - name: Generate types
        run: bun run build:docs

      - name: Build the docs site
        run: bun run build
        working-directory: docs

      - name: Scroll tests
        run: bunx playwright test
        working-directory: docs
