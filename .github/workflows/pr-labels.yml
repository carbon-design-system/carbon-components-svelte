name: PR labels

# `pull_request_target` gives fork PRs a write token. Nothing here checks out
# or runs PR code: the labeler reads .github/labeler.yml from the base branch,
# the title step reads the title as data, never via `${{ }}`, and `api-type`
# runs the base branch's script on the PR's files, read as text.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every label in .github/labeler.yml and the title step must already exist:
# without `issues: write`, adding a missing label fails instead of creating it.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        if: github.event.action != 'edited'
        with:
          sync-labels: true

      # A new default export in src/index.js -> "new-component". Path globs
      # can't tell an added export from an edited one, so this reads the diff.
      # Like `sync-labels`, it removes the label once the export is gone.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event.action != 'edited'
        with:
          script: |
            const LABEL = "new-component";
            const EXPORT = /^([+-])export \{ default as (\w+) \}/gm;

            const pr = context.payload.pull_request;
            const issue = { ...context.repo, issue_number: pr.number };
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const patch =
              files.find((file) => file.filename === "src/index.js")?.patch ?? "";

            const added = new Set();
            const removed = new Set();
            for (const [, sign, name] of patch.matchAll(EXPORT)) {
              (sign === "+" ? added : removed).add(name);
            }
            const isNew = [...added].some((name) => !removed.has(name));
            const has = pr.labels.some((label) => label.name === LABEL);

            if (isNew && !has) {
              await github.rest.issues.addLabels({ ...issue, labels: [LABEL] });
            } else if (!isNew && has) {
              await github.rest.issues.removeLabel({ ...issue, name: LABEL });
            }

      # Conventional commit title -> type label, `!` -> breaking. On a title
      # edit, labels the old title implied are removed; manual labels stay.
      # Skipped on push so a label removed by hand isn't re-added.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event.action != 'synchronize'
        with:
          script: |
            const TYPES = {
              feat: "enhancement",
              fix: "bug",
              perf: "performance",
              refactor: "refactor",
            };
            const BREAKING = "breaking changes";

            const labelsFor = (title = "", body = "") => {
              const match = /^(\w+)(?:\([^)]*\))?(!)?:/.exec(title);
              const labels = new Set();
              if (match && TYPES[match[1]]) labels.add(TYPES[match[1]]);
              if (match?.[2] || /^BREAKING[ -]CHANGE:/m.test(body)) {
                labels.add(BREAKING);
              }
              return labels;
            };

            const pr = context.payload.pull_request;
            const changes = context.payload.changes ?? {};
            const next = labelsFor(pr.title, pr.body ?? "");
            const prev = labelsFor(
              changes.title?.from ?? pr.title,
              changes.body?.from ?? pr.body ?? "",
            );
            const current = new Set(pr.labels.map((label) => label.name));
            const issue = { ...context.repo, issue_number: pr.number };

            for (const name of prev) {
              if (!next.has(name) && current.has(name)) {
                await github.rest.issues.removeLabel({ ...issue, name });
              }
            }
            const add = [...next].filter((name) => !current.has(name));
            if (add.length) {
              await github.rest.issues.addLabels({ ...issue, labels: add });
            }

  # A `fix`, `chore`, `refactor` or `perf` PR that adds a prop, slot, event
  # or typedef field is a feature (CONTRIBUTING, Commit messages). Compares
  # each changed component at the merge base and the head. Runs on every
  # push and title edit, and fails rather than labels: the type is in the
  # title, which the author fixes.
  api-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/lib/public-api.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { NON_FEATURE_TYPES, isComponent, misfiledApi, parseTitle } =
              await import(
                `${process.env.GITHUB_WORKSPACE}/scripts/lib/public-api.ts`
              );

            const pr = context.payload.pull_request;
            const body = pr.body ?? "";
            const { type, breaking } = parseTitle(pr.title, body);
            if (!NON_FEATURE_TYPES.includes(type) || breaking) return;

            const changed = (
              await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pr.number,
                per_page: 100,
              })
            ).filter((file) => isComponent(file.filename));
            if (!changed.length) return;

            const { data: compare } =
              await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${pr.base.sha}...${pr.head.sha}`,
                per_page: 1,
              });
            const mergeBase = compare.merge_base_commit.sha;

            // A fork's head is readable here by SHA through REST, not
            // through GraphQL's `object(expression:)`.
            const read = async (path, ref) => {
              try {
                const { data } = await github.rest.repos.getContent({
                  ...context.repo,
                  path,
                  ref,
                  mediaType: { format: "raw" },
                });
                return String(data);
              } catch (error) {
                if (error.status === 404) return "";
                throw error;
              }
            };
            const files = await Promise.all(
              changed.map(async (file) => ({
                path: file.filename,
                base:
                  file.status === "added"
                    ? ""
                    : await read(
                        file.previous_filename ?? file.filename,
                        mergeBase,
                      ),
                head:
                  file.status === "removed"
                    ? ""
                    : await read(file.filename, pr.head.sha),
              })),
            );

            const added = misfiledApi(pr.title, body, files);
            if (!added.length) return;
            core.setFailed(
              [
                `A "${type}" PR adds public API. Retitle it "feat", or move ` +
                  "the new API to a feat PR. A breaking change takes a `!`.",
                ...added.map(({ path, api }) => `  ${path}: ${api}`),
              ].join("\n"),
            );
