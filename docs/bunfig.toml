[install]
# Svelte comes from the repo root, as `src/` uses it. A second copy here,
# which Bun would install for each package that peers on it, would put
# two runtimes on the page, and svelte-bun fails the build on that.
peer = false

[serve.static]
# The site's own plugins first, so they resolve `carbon-components-svelte`
# and the virtual modules before svelte-bun looks at them.
plugins = ["./scripts/dev-plugin.ts", "./scripts/svelte.ts"]
