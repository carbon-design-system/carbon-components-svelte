<!doctype html>
<html lang="en" theme="white">
  <head>
    <meta charset="utf-8" />
    <!-- Fonts load only from IBM's CDN. TrustArc's cookie banner asks for
         its own 156 KB of IBM Plex Sans TTFs, which the page already has.
         The browser logs a CSP error for each one it blocks. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="font-src 'self' https://1.www.s81c.com data:"
    />
    <link rel="preconnect" href="https://1.www.s81c.com" crossorigin />
    <!-- The fonts nearly every page's text uses. The stylesheet asks for them
         only once a page renders, and text waits for its font. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://1.www.s81c.com/common/carbon/plex/fonts/IBM-Plex-Sans/fonts/split/woff2/IBMPlexSans-Regular-Latin1.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://1.www.s81c.com/common/carbon/plex/fonts/IBM-Plex-Sans/fonts/split/woff2/IBMPlexSans-SemiBold-Latin1.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://1.www.s81c.com/common/carbon/plex/fonts/IBM-Plex-Mono/fonts/split/woff2/IBMPlexMono-Regular-Latin1.woff2"
    />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Svelte implementation of the Carbon Design System"
    />
    <title>Carbon Components Svelte</title>
    <script>
      try {
        const theme = localStorage.getItem("theme");

        if (["white", "g10", "g80", "g90", "g100"].includes(theme)) {
          document.documentElement.setAttribute("theme", theme);
          document.documentElement.style.setProperty(
            "color-scheme",
            ["white", "g10"].includes(theme) ? "light" : "dark",
          );
        }
      } catch {}
    </script>
  </head>
  <body>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
