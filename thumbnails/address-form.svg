<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>address-form</title>
    <g id="address-form" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="street-label" fill="var(--cds-text-disabled, #c6c6c6)" x="76" y="46" width="56" height="6"></rect>
        <rect id="street" fill="var(--cds-field-01, #f4f4f4)" x="76" y="56" width="168" height="24"></rect>
        <rect id="street-border" fill="var(--cds-border-strong, #8d8d8d)" x="76" y="79" width="168" height="1"></rect>
        <rect id="city-label" fill="var(--cds-text-disabled, #c6c6c6)" x="76" y="92" width="24" height="6"></rect>
        <rect id="city" fill="var(--cds-field-01, #f4f4f4)" x="76" y="102" width="80" height="24"></rect>
        <rect id="city-border" fill="var(--cds-border-strong, #8d8d8d)" x="76" y="125" width="80" height="1"></rect>
        <rect id="region-label" fill="var(--cds-text-disabled, #c6c6c6)" x="160" y="92" width="20" height="6"></rect>
        <rect id="region" fill="var(--cds-field-01, #f4f4f4)" x="160" y="102" width="40" height="24"></rect>
        <rect id="region-border" fill="var(--cds-border-strong, #8d8d8d)" x="160" y="125" width="40" height="1"></rect>
        <rect id="postal-label" fill="var(--cds-text-disabled, #c6c6c6)" x="204" y="92" width="20" height="6"></rect>
        <rect id="postal" fill="var(--cds-field-01, #f4f4f4)" x="204" y="102" width="40" height="24"></rect>
        <rect id="postal-border" fill="var(--cds-background-brand, #0f62fe)" x="204" y="124" width="40" height="2"></rect>
    </g>
