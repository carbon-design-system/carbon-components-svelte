<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>chat-button</title>
    <g id="chat-button" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <circle id="avatar" fill="var(--cds-text-secondary, #525252)" cx="72" cy="68" r="8"></circle>
        <rect id="message" fill="var(--cds-field-01, #f4f4f4)" stroke="var(--cds-border-subtle, #e0e0e0)" x="88" y="57" width="128" height="22"></rect>
        <rect id="action-1" stroke="var(--cds-background-brand, #0f62fe)" x="88.5" y="91.5" width="63" height="31" rx="15.5"></rect>
        <rect id="action-1-label" fill="var(--cds-background-brand, #0f62fe)" x="104" y="103" width="32" height="8"></rect>
        <rect id="selected" fill="var(--cds-border-subtle, #e0e0e0)" x="156" y="91" width="52" height="32" rx="16"></rect>
        <rect id="selected-label" fill="var(--cds-text-secondary, #525252)" x="170" y="103" width="24" height="8"></rect>
        <rect id="action-2" stroke="var(--cds-background-brand, #0f62fe)" x="212.5" y="91.5" width="43" height="31" rx="15.5"></rect>
        <rect id="action-2-label" fill="var(--cds-background-brand, #0f62fe)" x="224" y="103" width="20" height="8"></rect>
    </g>
</svg>
