<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>comparison-bar</title>
    <g id="comparison-bar" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="label" fill="var(--cds-text-disabled, #c6c6c6)" x="76" y="66" width="56" height="8"></rect>
        <rect id="value-text" fill="var(--cds-layer-accent-active, #a8a8a8)" x="212" y="66" width="32" height="8"></rect>
        <rect id="current" fill="var(--cds-background-brand, #0f62fe)" x="76" y="84" width="140" height="8"></rect>
        <rect id="previous" fill="var(--cds-text-disabled, #c6c6c6)" x="76" y="98" width="104" height="8"></rect>
    </g>
</svg>
