        <circle id="from-1" fill="var(--cds-border-strong, #8d8d8d)" cx="120" cy="56" r="6"></circle>
        <circle id="to-1" fill="var(--cds-background-brand, #0f62fe)" cx="200" cy="56" r="6"></circle>
        <rect id="label-2" fill="var(--cds-text-disabled, #c6c6c6)" x="64" y="76" width="28" height="8"></rect>
