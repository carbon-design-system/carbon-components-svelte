<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>filter-chips</title>
    <g id="filter-chips" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="chip-1" fill="var(--cds-background-brand, #0f62fe)" x="76" y="78" width="72" height="24" rx="12"></rect>
        <rect id="chip-1-label" fill="var(--cds-text-on-color, #ffffff)" x="88" y="87" width="38" height="6"></rect>
        <rect id="chip-1-close-a" fill="var(--cds-text-on-color, #ffffff)" x="131.5" y="89" width="9" height="1.5" transform="rotate(45 136 89.75)"></rect>
        <rect id="chip-1-close-b" fill="var(--cds-text-on-color, #ffffff)" x="131.5" y="89" width="9" height="1.5" transform="rotate(-45 136 89.75)"></rect>
        <rect id="chip-2" fill="var(--cds-border-subtle, #e0e0e0)" x="156" y="78" width="56" height="24" rx="12"></rect>
        <rect id="chip-2-label" fill="var(--cds-layer-accent-active, #a8a8a8)" x="168" y="87" width="22" height="6"></rect>
        <rect id="chip-2-close-a" fill="var(--cds-layer-accent-active, #a8a8a8)" x="195.5" y="89" width="9" height="1.5" transform="rotate(45 200 89.75)"></rect>
        <rect id="chip-2-close-b" fill="var(--cds-layer-accent-active, #a8a8a8)" x="195.5" y="89" width="9" height="1.5" transform="rotate(-45 200 89.75)"></rect>
        <rect id="chip-3" fill="var(--cds-border-subtle, #e0e0e0)" x="220" y="78" width="24" height="24" rx="12"></rect>
        <rect id="chip-3-label" fill="var(--cds-layer-accent-active, #a8a8a8)" x="228" y="87" width="8" height="6"></rect>
