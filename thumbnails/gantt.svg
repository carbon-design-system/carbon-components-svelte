<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>gantt</title>
    <g id="gantt" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="header" fill="var(--cds-border-subtle, #e0e0e0)" x="60" y="50" width="200" height="12"></rect>
        <rect id="header-list" fill="var(--cds-text-secondary, #525252)" x="68" y="54" width="30" height="4"></rect>
        <rect id="list-divider" fill="var(--cds-border-strong, #8d8d8d)" x="112" y="50" width="1" height="72"></rect>
        <rect id="row-divider-1" fill="var(--cds-border-subtle, #e0e0e0)" x="60" y="82" width="200" height="1"></rect>
        <rect id="row-divider-2" fill="var(--cds-border-subtle, #e0e0e0)" x="60" y="102" width="200" height="1"></rect>
        <rect id="row-divider-3" fill="var(--cds-border-subtle, #e0e0e0)" x="60" y="122" width="200" height="1"></rect>
        <rect id="row-1-text" fill="var(--cds-layer-accent-active, #a8a8a8)" x="68" y="69" width="36" height="6"></rect>
        <rect id="row-2-text" fill="var(--cds-text-secondary, #525252)" x="68" y="89" width="30" height="6"></rect>
