        <polygon id="milestone" fill="var(--cds-interactive, #0f62fe)" points="236 106 242 112 236 118 230 112"></polygon>
        <path id="link-1" d="M162 72 H167 V92 H172" stroke="var(--cds-icon-secondary, #525252)" stroke-width="1.5"></path>
        <path id="link-2" d="M210 92 H220 V112 H229" stroke="var(--cds-icon-secondary, #525252)" stroke-width="1.5"></path>
