<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>image-compare</title>
    <g id="image-compare" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="before" fill="var(--cds-border-subtle, #e0e0e0)" x="76" y="40" width="84" height="100"></rect>
        <rect id="after" fill="var(--cds-border-strong, #8d8d8d)" x="160" y="40" width="84" height="100"></rect>
        <rect id="divider" fill="var(--cds-background-brand, #0f62fe)" x="159" y="40" width="2" height="100"></rect>
        <circle id="handle" fill="var(--cds-background-brand, #0f62fe)" cx="160" cy="90" r="14"></circle>
        <polygon id="handle-start" fill="var(--cds-text-on-color, #ffffff)" points="153 90 158 85 158 95"></polygon>
        <polygon id="handle-end" fill="var(--cds-text-on-color, #ffffff)" points="167 90 162 85 162 95"></polygon>
    </g>
</svg>
