        <rect id="error-border" fill="var(--cds-support-error, #da1e28)" x="122" y="88" width="68" height="12" opacity="0.25"></rect>
        <rect id="error-underline" fill="var(--cds-support-error, #da1e28)" x="122" y="99" width="68" height="1"></rect>
        <rect id="cell-4" fill="var(--cds-text-secondary, #525252)" x="56" y="108" width="40" height="4"></rect>
        <rect id="cell-5" fill="var(--cds-text-secondary, #525252)" x="128" y="108" width="52" height="4"></rect>
        <rect id="continue" fill="var(--cds-background-brand, #0f62fe)" x="208" y="136" width="64" height="24"></rect>
