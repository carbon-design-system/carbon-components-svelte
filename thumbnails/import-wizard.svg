<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>import-wizard</title>
    <g id="import-wizard" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="step-1" fill="var(--cds-background-brand, #0f62fe)" x="48" y="32" width="52" height="2"></rect>
        <rect id="step-2" fill="var(--cds-background-brand, #0f62fe)" x="104" y="32" width="52" height="2"></rect>
        <rect id="step-3" fill="var(--cds-border-subtle, #e0e0e0)" x="160" y="32" width="52" height="2"></rect>
        <rect id="step-4" fill="var(--cds-border-subtle, #e0e0e0)" x="216" y="32" width="52" height="2"></rect>
        <rect id="header" fill="var(--cds-layer-accent, #e0e0e0)" x="48" y="52" width="224" height="16"></rect>
        <rect id="row-1" fill="var(--cds-layer, #f4f4f4)" x="48" y="68" width="224" height="16"></rect>
        <rect id="row-2" fill="var(--cds-layer, #f4f4f4)" x="48" y="85" width="224" height="16"></rect>
        <rect id="row-3" fill="var(--cds-layer, #f4f4f4)" x="48" y="102" width="224" height="16"></rect>
        <rect id="head-1" fill="var(--cds-icon-primary, #161616)" x="56" y="58" width="36" height="4"></rect>
        <rect id="head-2" fill="var(--cds-icon-primary, #161616)" x="128" y="58" width="36" height="4"></rect>
        <rect id="head-3" fill="var(--cds-icon-primary, #161616)" x="200" y="58" width="36" height="4"></rect>
        <rect id="cell-1" fill="var(--cds-text-secondary, #525252)" x="56" y="74" width="48" height="4"></rect>
        <rect id="cell-2" fill="var(--cds-text-secondary, #525252)" x="128" y="74" width="40" height="4"></rect>
        <rect id="cell-3" fill="var(--cds-text-secondary, #525252)" x="200" y="74" width="32" height="4"></rect>
