        <rect id="name-3" fill="var(--cds-text-secondary, #525252)" x="88" y="132" width="52" height="8"></rect>
        <rect id="endonym-3" fill="var(--cds-layer-accent-active, #a8a8a8)" x="146" y="132" width="32" height="8"></rect>
        <rect id="code-3" fill="none" stroke="var(--cds-layer-accent-active, #a8a8a8)" stroke-width="1" x="212.5" y="129.5" width="20" height="13"></rect>
