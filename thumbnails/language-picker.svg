        <rect id="code-text-1" fill="var(--cds-text-secondary, #525252)" x="217" y="94" width="10" height="4"></rect>
        <rect id="name-2" fill="var(--cds-text-secondary, #525252)" x="88" y="112" width="36" height="8"></rect>
