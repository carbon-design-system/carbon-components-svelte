        <rect id="tool-link" fill="var(--cds-icon-secondary, #525252)" x="212" y="47" width="8" height="8"></rect>
        <rect id="tool-list" fill="var(--cds-icon-secondary, #525252)" x="226" y="47" width="8" height="8"></rect>
