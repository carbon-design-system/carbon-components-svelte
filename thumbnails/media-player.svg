<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>media-player</title>
    <g id="media-player" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="frame" fill="var(--cds-background-inverse, #393939)" x="60" y="40" width="200" height="100"></rect>
        <polygon id="play" fill="var(--cds-icon-inverse, #ffffff)" points="150,60 150,92 178,76"></polygon>
        <rect id="track" fill="var(--cds-border-strong, #8d8d8d)" x="72" y="112" width="176" height="4"></rect>
        <rect id="bar" fill="var(--cds-background-brand, #0f62fe)" x="72" y="112" width="84" height="4"></rect>
        <circle id="thumb" fill="var(--cds-icon-inverse, #ffffff)" cx="156" cy="114" r="6"></circle>
        <rect id="time" fill="var(--cds-text-disabled, #c6c6c6)" x="72" y="124" width="32" height="6"></rect>
    </g>
</svg>
