<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>onboarding-checklist</title>
    <g id="onboarding-checklist" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="track" fill="var(--cds-border-subtle, #e0e0e0)" x="76" y="48" width="168" height="4"></rect>
        <rect id="progress" fill="var(--cds-background-brand, #0f62fe)" x="76" y="48" width="112" height="4"></rect>
        <g id="done-1">
            <rect x="76" y="70" width="16" height="16" rx="1" fill="var(--cds-icon-primary, #161616)"></rect>
            <g transform="translate(80, 70) translate(9, 5) rotate(-45) translate(-9, -5)">
                <path d="M0 0V5M0 5H9" stroke="var(--cds-icon-inverse, #ffffff)" stroke-width="2" stroke-linecap="square"></path>
            </g>
            <rect id="label" fill="var(--cds-border-subtle, #e0e0e0)" x="104" y="74" width="112" height="8"></rect>
        </g>
        <g id="done-2">
            <rect x="76" y="94" width="16" height="16" rx="1" fill="var(--cds-icon-primary, #161616)"></rect>
            <g transform="translate(80, 94) translate(9, 5) rotate(-45) translate(-9, -5)">
                <path d="M0 0V5M0 5H9" stroke="var(--cds-icon-inverse, #ffffff)" stroke-width="2" stroke-linecap="square"></path>
            </g>
            <rect id="label" fill="var(--cds-border-subtle, #e0e0e0)" x="104" y="98" width="92" height="8"></rect>
        </g>
        <g id="open">
            <rect x="76.5" y="118.5" width="15" height="15" rx="1" fill="none" stroke="var(--cds-icon-primary, #161616)" stroke-width="1"></rect>
            <rect id="label" fill="var(--cds-layer-accent-active, #a8a8a8)" x="104" y="122" width="104" height="8"></rect>
        </g>
    </g>
</svg>
