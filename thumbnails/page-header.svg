<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>page-header</title>
    <g id="page-header" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="breadcrumb" fill="var(--cds-interactive-01, #0f62fe)" x="64" y="42" width="40" height="6"></rect>
        <rect id="title" fill="var(--cds-text-secondary, #525252)" x="64" y="60" width="112" height="16"></rect>
        <rect id="subtitle" fill="var(--cds-text-disabled, #c6c6c6)" x="64" y="86" width="148" height="6"></rect>
        <g id="tabs">
            <rect id="tab-1" fill="var(--cds-text-secondary, #525252)" x="72" y="114" width="40" height="6"></rect>
            <rect id="tab-2" fill="var(--cds-text-placeholder, #a8a8a8)" x="136" y="114" width="44" height="6"></rect>
            <rect id="track" fill="var(--cds-border-subtle, #e0e0e0)" x="64" y="131" width="192" height="1"></rect>
            <rect id="selected" fill="var(--cds-interactive-01, #0f62fe)" x="64" y="130" width="56" height="2"></rect>
