<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>people-picker</title>
    <g id="people-picker" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="label" fill="var(--cds-text-disabled, #c6c6c6)" x="76" y="44" width="64" height="8"></rect>
        <rect id="field" fill="var(--cds-field-01, #f4f4f4)" x="76" y="60" width="168" height="32"></rect>
        <rect id="bottom-border" fill="var(--cds-border-strong, #8d8d8d)" x="76" y="91" width="168" height="1"></rect>
        <g id="chip-1">
            <rect fill="var(--cds-border-subtle, #e0e0e0)" x="84" y="67" width="56" height="18" rx="9"></rect>
            <circle fill="var(--cds-background-brand, #0f62fe)" cx="93" cy="76" r="7"></circle>
            <rect fill="var(--cds-text-secondary, #525252)" x="105" y="74" width="26" height="4"></rect>
        </g>
        <g id="chip-2">
            <rect fill="var(--cds-border-subtle, #e0e0e0)" x="146" y="67" width="56" height="18" rx="9"></rect>
            <circle fill="var(--cds-support-success, #198038)" cx="155" cy="76" r="7"></circle>
            <rect fill="var(--cds-text-secondary, #525252)" x="167" y="74" width="26" height="4"></rect>
        </g>
        <rect id="menu" fill="var(--cds-field-01, #f4f4f4)" x="76" y="96" width="168" height="56"></rect>
        <g id="row-1">
            <circle fill="var(--cds-button-secondary, #393939)" cx="92" cy="110" r="7"></circle>
            <rect fill="var(--cds-text-secondary, #525252)" x="106" y="108" width="44" height="4"></rect>
            <rect fill="var(--cds-border-subtle, #e0e0e0)" x="156" y="108" width="40" height="4"></rect>
        </g>
        <rect id="divider" fill="var(--cds-border-subtle, #e0e0e0)" x="84" y="124" width="152" height="1"></rect>
        <g id="row-2">
            <circle fill="var(--cds-layer-accent-active, #a8a8a8)" cx="92" cy="138" r="7"></circle>
            <rect fill="var(--cds-text-secondary, #525252)" x="106" y="136" width="36" height="4"></rect>
            <rect fill="var(--cds-border-subtle, #e0e0e0)" x="148" y="136" width="48" height="4"></rect>
        </g>
    </g>
</svg>
