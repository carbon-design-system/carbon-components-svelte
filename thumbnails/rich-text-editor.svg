<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>rich-text-editor</title>
    <g id="rich-text-editor" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="label" fill="var(--cds-text-disabled, #c6c6c6)" x="76" y="40" width="64" height="8"></rect>
        <rect id="field" fill="var(--cds-field-01, #f4f4f4)" x="76" y="56" width="168" height="84"></rect>
        <rect id="bottom-border" fill="var(--cds-border-strong, #8d8d8d)" x="76" y="139" width="168" height="1"></rect>
        <rect id="toolbar-divider" fill="var(--cds-border-subtle, #e0e0e0)" x="76" y="82" width="168" height="1"></rect>
        <g id="toolbar" fill="var(--cds-icon-primary, #161616)">
