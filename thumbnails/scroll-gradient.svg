<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>scroll-gradient</title>
    <defs>
        <clipPath id="scroll-gradient-clip">
            <rect x="76" y="42" width="168" height="96"></rect>
        </clipPath>
        <linearGradient id="scroll-gradient-fade-top" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--cds-ui-02, #ffffff)" stop-opacity="1"></stop>
            <stop offset="1" stop-color="var(--cds-ui-02, #ffffff)" stop-opacity="0"></stop>
        </linearGradient>
        <linearGradient id="scroll-gradient-fade-bottom" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--cds-ui-02, #ffffff)" stop-opacity="0"></stop>
            <stop offset="1" stop-color="var(--cds-ui-02, #ffffff)" stop-opacity="1"></stop>
        </linearGradient>
    </defs>
    <g id="scroll-gradient" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="surface" fill="var(--cds-ui-02, #ffffff)" stroke="var(--cds-border-subtle, #e0e0e0)" stroke-width="1" x="76" y="42" width="168" height="96"></rect>
        <g id="content" clip-path="url(#scroll-gradient-clip)" fill="var(--cds-text-placeholder, #a8a8a8)">
            <rect x="90" y="38" width="140" height="6"></rect>
            <rect x="90" y="54" width="120" height="6"></rect>
            <rect x="90" y="70" width="132" height="6"></rect>
            <rect x="90" y="86" width="100" height="6"></rect>
            <rect x="90" y="102" width="124" height="6"></rect>
            <rect x="90" y="118" width="90" height="6"></rect>
            <rect x="90" y="134" width="112" height="6"></rect>
        </g>
        <rect id="fade-top" fill="url(#scroll-gradient-fade-top)" x="76" y="42" width="168" height="20"></rect>
        <rect id="fade-bottom" fill="url(#scroll-gradient-fade-bottom)" x="76" y="118" width="168" height="20"></rect>
    </g>
</svg>
