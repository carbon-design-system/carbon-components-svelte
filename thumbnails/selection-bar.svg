<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>selection-bar</title>
    <g id="selection-bar" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="check-1" fill="var(--cds-icon-primary, #161616)" x="64" y="36" width="12" height="12"></rect>
        <rect id="row-1" fill="var(--cds-text-secondary, #525252)" x="88" y="39" width="96" height="6"></rect>
