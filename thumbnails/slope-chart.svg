<?xml version="1.0" encoding="UTF-8"?>
<svg width="320px" height="180px" viewBox="0 0 320 180" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>slope-chart</title>
    <g id="slope-chart" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="column-left" fill="var(--cds-border-subtle, #e0e0e0)" x="108" y="40" width="1" height="97"></rect>
        <rect id="column-right" fill="var(--cds-border-subtle, #e0e0e0)" x="212" y="40" width="1" height="97"></rect>
        <line id="slope-1" stroke="var(--cds-background-brand, #0f62fe)" stroke-width="2" x1="108" y1="104" x2="212" y2="56"></line>
        <circle id="start-1" fill="var(--cds-background-brand, #0f62fe)" cx="108" cy="104" r="4"></circle>
        <circle id="end-1" fill="var(--cds-background-brand, #0f62fe)" cx="212" cy="56" r="4"></circle>
        <line id="slope-2" stroke="var(--cds-border-strong, #8d8d8d)" stroke-width="2" x1="108" y1="64" x2="212" y2="88"></line>
        <circle id="start-2" fill="var(--cds-border-strong, #8d8d8d)" cx="108" cy="64" r="4"></circle>
