        <line id="slope-3" stroke="var(--cds-text-disabled, #c6c6c6)" stroke-width="2" x1="108" y1="84" x2="212" y2="112"></line>
        <circle id="start-3" fill="var(--cds-text-disabled, #c6c6c6)" cx="108" cy="84" r="4"></circle>
        <circle id="end-3" fill="var(--cds-text-disabled, #c6c6c6)" cx="212" cy="112" r="4"></circle>
