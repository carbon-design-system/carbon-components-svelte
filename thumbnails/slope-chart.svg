        <circle id="start-4" fill="var(--cds-text-disabled, #c6c6c6)" cx="108" cy="120" r="4"></circle>
        <circle id="end-4" fill="var(--cds-text-disabled, #c6c6c6)" cx="212" cy="124" r="4"></circle>
